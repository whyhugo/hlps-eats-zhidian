# Cloudflare Workers 設定：web/ 是網頁（靜態資源），worker/ 處理 AI 小教練 API。
# 部署方式見 docs/MANUAL.md 第 12 節。祕密值（API 金鑰）不要寫在這裡，請到 Cloudflare 後台設定。
name = "hlps-eats-zhidian"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./web"
binding = "ASSETS"

[vars]
# 想換模型時改這裡
FITWELL_AI_MODEL = "claude-opus-5-5"

# AI 小教練限流：同一個 IP 每 60 秒最多 10 次
[[ratelimits]]
name = "COACH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
