# Cloudflare Workers 設定：web/ 是網頁（靜態資源），worker/ 處理 AI 小教練 API。
# 部署方式見 docs/MANUAL.md 第 12 節。祕密值（API 金鑰）不要寫在這裡，請到 Cloudflare 後台設定。
name = "hlps-eats-zhidian"
main = "worker/index.js"
compatibility_date = "2025-09-01"
# 部署時保留在 Cloudflare 後台設定的變數（例如 FITWELL_AI_THINKING），不要被清掉
keep_vars = true

[assets]
directory = "./web"
binding = "ASSETS"

# AI 小教練（Gemini）的設定不寫在這裡，請到 Cloudflare 後台 Worker → Settings → Variables and Secrets：
#   GEMINI_API_KEY（Secret，必要）、FITWELL_AI_MODEL、FITWELL_AI_THINKING、FITWELL_AI_MAX_TOKENS、FITWELL_AI_GOOGLE_SEARCH
#   寫在這裡的 [vars] 每次部署都會蓋掉後台的設定，所以留空。說明見 worker/gemini.js。

# AI 小教練限流：同一個 IP 每 60 秒最多 10 次
[[ratelimits]]
name = "COACH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
