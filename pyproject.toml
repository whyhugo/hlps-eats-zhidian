[project]
name = "fitwell"
version = "0.1.0"
description = "Fit & Well Menu Navigator：竹北遠百健身／養生餐點推薦機"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyserial>=3.5",
]

[project.optional-dependencies]
ai = ["google-genai>=2.31"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fitwell = "fitwell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitwell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
