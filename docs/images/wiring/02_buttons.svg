<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 572"><rect width="960" height="572" rx="22" fill="#f6f4ef"/><rect x="16" y="16" width="928" height="540" rx="18" fill="#ffffff" stroke="#e3dfd6"/><text x="44" y="62" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1f2a24" font-weight="bold" text-anchor="start">② 加分：健身／養生實體按鈕</text><text x="44" y="90" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#6b746e" font-weight="normal" text-anchor="start">選用 · P13、P14、GND</text><rect x="44" y="120" width="230" height="208" rx="16" fill="#1f5f46"/><rect x="52" y="128" width="214" height="192" rx="11" fill="none" stroke="#2b7a5b" stroke-width="2"/><text x="66" y="158" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">micro:bit 擴充板</text><rect x="62" y="173" width="58" height="30" rx="8" fill="#2f6fdf"/><text x="91" y="194" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">P13</text><text x="130" y="195" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">健身</text><circle cx="270" cy="190" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><rect x="62" y="219" width="58" height="30" rx="8" fill="#0f9b8e"/><text x="91" y="240" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">P14</text><text x="130" y="241" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">養生</text><circle cx="270" cy="236" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><rect x="62" y="265" width="58" height="30" rx="8" fill="#2b2b2b"/><text x="91" y="286" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">GND</text><text x="130" y="287" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">接地</text><circle cx="270" cy="282" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><path d="M270,190 C395.0,190 395.0,190 520,190" fill="none" stroke="#00000033" stroke-width="8" stroke-linecap="round"/><path d="M270,190 C395.0,190 395.0,190 520,190" fill="none" stroke="#2f6fdf" stroke-width="5" stroke-linecap="round"/><line x1="520" y1="190" x2="630" y2="190" stroke="#9aa0a6" stroke-width="3"/><rect x="549" y="164" width="52" height="52" rx="6" fill="#2d2f33"/><circle cx="575" cy="190" r="17" fill="#2f6fdf" stroke="#ffffff55" stroke-width="2"/><text x="575" y="236" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="bold" text-anchor="middle">💪 健身按鈕</text><path d="M630,190 L860,190" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M630,190 L860,190" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,236 C395.0,236 395.0,300 520,300" fill="none" stroke="#00000033" stroke-width="8" stroke-linecap="round"/><path d="M270,236 C395.0,236 395.0,300 520,300" fill="none" stroke="#0f9b8e" stroke-width="5" stroke-linecap="round"/><line x1="520" y1="300" x2="630" y2="300" stroke="#9aa0a6" stroke-width="3"/><rect x="549" y="274" width="52" height="52" rx="6" fill="#2d2f33"/><circle cx="575" cy="300" r="17" fill="#2f6fdf" stroke="#ffffff55" stroke-width="2"/><text x="575" y="346" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="bold" text-anchor="middle">🍵 養生按鈕</text><path d="M630,300 L860,300" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M630,300 L860,300" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,282 L310,282 L310,380 L860,380" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,282 L310,282 L310,380 L860,380" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="851" y="160" width="18" height="232" rx="9" fill="#dfe7f5" stroke="#2f6fdf" stroke-width="2"/><text x="860" y="148" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#2f6fdf" font-weight="bold" text-anchor="middle">GND（−）</text><rect x="44" y="430" width="872" height="122" rx="14" fill="#fff7ec" stroke="#f3c98b" stroke-width="1.5"/><text x="64" y="460" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start">接線重點</text><text x="64" y="488" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">① 按鈕一腳接腳位、另一腳接 GND，不用電阻（程式會開啟內部上拉）。</text><text x="64" y="514" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">② 2 腳按鈕：兩腳各接一邊。4 腳按鈕：跨在麵包板中間凹槽上，取「對角線」的兩隻腳。</text><text x="64" y="540" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">③ 按下「健身」＝ 切到健身並立刻推薦；「養生」同理。沒接按鈕程式也照常運作。</text></svg>