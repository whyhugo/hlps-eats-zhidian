<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 578"><rect width="960" height="578" rx="22" fill="#f6f4ef"/><rect x="16" y="16" width="928" height="546" rx="18" fill="#ffffff" stroke="#e3dfd6"/><text x="44" y="62" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1f2a24" font-weight="bold" text-anchor="start">⑤ 加分：音效（蜂鳴器）</text><text x="44" y="90" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#6b746e" font-weight="normal" text-anchor="start">選用 · P16、GND</text><rect x="44" y="120" width="230" height="162" rx="16" fill="#1f5f46"/><rect x="52" y="128" width="214" height="146" rx="11" fill="none" stroke="#2b7a5b" stroke-width="2"/><text x="66" y="158" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">micro:bit 擴充板</text><rect x="62" y="173" width="58" height="30" rx="8" fill="#e0457b"/><text x="91" y="194" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">P16</text><text x="130" y="195" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">聲音</text><circle cx="270" cy="190" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><rect x="62" y="219" width="58" height="30" rx="8" fill="#2b2b2b"/><text x="91" y="240" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">GND</text><text x="130" y="241" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">接地</text><circle cx="270" cy="236" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><circle cx="600" cy="190" r="44" fill="#2d2f33"/><circle cx="600" cy="190" r="8" fill="#111"/><text x="630" y="160" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" fill="#d6402f" font-weight="bold" text-anchor="start">+</text><text x="656" y="196" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#1f2a24" font-weight="bold" text-anchor="start">蜂鳴器</text><line x1="586" y1="230" x2="586" y2="290" stroke="#9aa0a6" stroke-width="3"/><line x1="614" y1="230" x2="614" y2="290" stroke="#9aa0a6" stroke-width="3"/><text x="580" y="308" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="end">+ 長腳</text><text x="620" y="308" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="start">− 短腳</text><path d="M270,190 C459.6,190 396.4,290 586,290" fill="none" stroke="#00000033" stroke-width="8" stroke-linecap="round"/><path d="M270,190 C459.6,190 396.4,290 586,290" fill="none" stroke="#e0457b" stroke-width="5" stroke-linecap="round"/><path d="M270,236 L304,236 L304,340 L614,340 L614,290" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,236 L304,236 L304,340 L614,340 L614,290" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="730" y="130" width="170" height="150" rx="12" fill="#f3f6fb" stroke="#d6e0f0"/><text x="740" y="156" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#2f6fdf" font-weight="bold" text-anchor="start">怎麼分辨？</text><text x="740" y="182" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">無源（類比）：</text><text x="740" y="202" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="start">底部看得到電路板</text><text x="740" y="222" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="start">buzzer: "passive"</text><text x="740" y="248" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">有源（數位）：</text><text x="740" y="268" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="start">底部封黑膠、接 3V 會叫</text><rect x="44" y="410" width="872" height="148" rx="14" fill="#fff7ec" stroke="#f3c98b" stroke-width="1.5"/><text x="64" y="440" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start">接線重點</text><text x="64" y="468" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">① 蜂鳴器 + 接 P16、− 接 GND。程式已把聲音改從 P16 輸出，P0 的綠燈不會跟著閃。</text><text x="64" y="494" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">② 無源（類比）蜂鳴器：能發出不同音高（建議）。有源（數位）蜂鳴器：只會「嗶」，要把</text><text x="64" y="520" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">    config/hardware.json 的 buzzer 改成 "active"。不確定時先用 "passive"，怪怪的再改。</text><text x="64" y="546" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">③ micro:bit V2 本身有喇叭，不接蜂鳴器也有聲音；V1 一定要外接才有聲音。</text></svg>