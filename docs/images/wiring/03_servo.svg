0" rx="12" fill="#2f6fdf"/><rect x="680" y="120" width="56" height="24" rx="6" fill="#2f6fdf"/><circle cx="708" cy="120" r="12" fill="#ffffff"/><rect x="700" y="104" width="90" height="12" rx="6" fill="#ffffff" stroke="#c9d6f2"/><text x="715" y="206" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">SG90</text><text x="715" y="230" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#dbe6ff" font-weight="normal" text-anchor="middle">伺服馬達</text><rect x="554" y="160" width="22" height="92" rx="5" fill="#2d2f33"/><line x1="576" y1="176" x2="640" y2="176" stroke="#f08c1a" stroke-width="6"/><circle cx="565" cy="176" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><line x1="576" y1="206" x2="640" y2="206" stroke="#d6402f" stroke-width="6"/><circle cx="565" cy="206" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><line x1="576" y1="236" x2="640" y2="236" stroke="#7a4a22" stroke-width="6"/><circle cx="565" cy="236" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><rect x="812" y="150" width="14" height="14" rx="3" fill="#f08c1a"/><text x="834" y="162" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">橘線 訊號</text><text x="834" y="180" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="start">→ P12</text><rect x="812" y="190" width="14" height="14" rx="3" fill="#d6402f"/><text x="834" y="202" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">紅線 電源 +</text><text x="834" y="220" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="start">→ 電池 +</text><rect x="812" y="230" width="14" height="14" rx="3" fill="#7a4a22"/><text x="834" y="242" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">棕線 GND</text><text x="834" y="260" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="start">→ GND</text><rect x="600" y="330" width="170" height="70" rx="10" fill="#2d2f33"/><rect x="612" y="344" width="66" height="42" rx="8" fill="#e8b64c"/><rect x="692" y="344" width="66" height="42" rx="8" fill="#e8b64c"/><text x="645" y="371" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="bold" text-anchor="middle">AA</text><text x="725" y="371" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="bold" text-anchor="middle">AA</text><text x="685" y="422" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="bold" text-anchor="middle">2 顆 AA 電池盒（3V）</text><text x="784" y="352" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" fill="#d6402f" font-weight="bold" text-anchor="start">+</text><text x="586" y="380" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" fill="#2b2b2b" font-weight="bold" text-anchor="end">−</text><path d="M270,190 C417.5,190 417.5,176 565,176" fill="none" stroke="#00000033" stroke-width="8" stroke-linecap="round"/><path d="M270,190 C417.5,190 417.5,176 565,176" fill="none" stroke="#f08c1a" stroke-width="5" stroke-linecap="round"/><path d="M270,236 L565,236" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,236 L565,236" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M600,375 L520,375 L520,236" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M600,375 L520,375 L520,236" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="520" cy="236" r="7" fill="#2b2b2b"/><path d="M770,346 L810,346 L810,300 L540,300 L540,206 L565,206" fill="none" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"/><path d="M770,346 L810,346 L810,300 L540,300 L540,206 L565,206" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M770,346 L810,346 L810,300 L540,300 L540,206 L565,206" fill="none" stroke="#d6402f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="44" y="450" width="872" height="148" rx="14" fill="#fff7ec" stroke="#f3c98b" stroke-width="1.5"/><text x="64" y="480" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start">接線重點</text><text x="64" y="508" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">① 橘線（訊號）接 P12；棕線（GND）、電池盒 − 和 micro:bit 的 GND 要接在一起（共地）。</text><text x="64" y="534" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">② 紅線（電源 +）接電池盒 +。不要接 3V 或 IOBIT 的 5V（啟動電流大，會讓 micro:bit 重開或 IOBIT 斷電）。</text><text x="64" y="560" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">③ 推薦結果越健康，指針越往右（綠色區）；方向相反時把 config/hardware.json 的 servo_reverse 改成 true。</text><text x="64" y="586" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">④ 開機時指針會轉到正中間（90°），用來對齊紙板刻度；按推薦時先歸零再轉到結果。</text></svg>