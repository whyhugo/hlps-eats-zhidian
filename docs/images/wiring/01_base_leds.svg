t-anchor="start">③ 電阻：220Ω（紅紅棕）或套件的 100Ω（棕黑棕）都可以；不要用 10kΩ（棕黑橙），燈會幾乎不亮。</text><text x="64" y="636" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">④ 這是「基本電路」：只接這三顆燈，micro:bit 程式就能完整運作。</text></svg>