<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 588"><rect width="960" height="588" rx="22" fill="#f6f4ef"/><rect x="16" y="16" width="928" height="556" rx="18" fill="#ffffff" stroke="#e3dfd6"/><text x="44" y="62" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1f2a24" font-weight="bold" text-anchor="start">⑥ 加分：預算旋鈕（可變電阻）</text><text x="44" y="90" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#6b746e" font-weight="normal" text-anchor="start">選用 · P4、3V、GND，需要 10kΩ 電阻</text><rect x="44" y="120" width="230" height="208" rx="16" fill="#1f5f46"/><rect x="52" y="128" width="214" height="192" rx="11" fill="none" stroke="#2b7a5b" stroke-width="2"/><text x="66" y="158" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">micro:bit 擴充板</text><rect x="62" y="173" width="58" height="30" rx="8" fill="#d6402f"/><text x="91" y="194" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">3V</text><text x="130" y="195" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">電源</text><circle cx="270" cy="190" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><rect x="62" y="219" width="58" height="30" rx="8" fill="#0f9b8e"/><text x="91" y="240" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">P4</text><text x="130" y="241" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">讀預算</text><circle cx="270" cy="236" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><rect x="62" y="265" width="58" height="30" rx="8" fill="#2b2b2b"/><text x="91" y="286" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">GND</text><text x="130" y="287" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#d9efe5" font-weight="normal" text-anchor="start">接地</text><circle cx="270" cy="282" r="6" fill="#e8b64c" stroke="#7a5a12" stroke-width="1.5"/><rect x="700" y="150" width="150" height="172" rx="14" fill="#2f6fdf"/><circle cx="780" cy="236" r="38" fill="#e8ecf2" stroke="#ffffff" stroke-width="3"/><rect x="777" y="202" width="6" height="30" rx="3" fill="#1f2a24"/><text x="775" y="352" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="bold" text-anchor="middle">10K 可變電阻（3 腳）</text><line x1="670" y1="190" x2="700" y2="190" stroke="#9aa0a6" stroke-width="3"/><text x="664" y="180" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="end">腳 1</text><line x1="670" y1="236" x2="700" y2="236" stroke="#9aa0a6" stroke-width="3"/><text x="664" y="226" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="end">腳 2（中間）</text><line x1="670" y1="282" x2="700" y2="282" stroke="#9aa0a6" stroke-width="3"/><text x="664" y="272" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#6b746e" font-weight="normal" text-anchor="end">腳 3</text><path d="M270,190 L670,190" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,190 L670,190" fill="none" stroke="#d6402f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,282 L670,282" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,282 L670,282" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,236 L420,236" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M270,236 L420,236" fill="none" stroke="#0f9b8e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="420" y1="236" x2="530" y2="236" stroke="#9aa0a6" stroke-width="3"/><rect x="445" y="224" width="60" height="24" rx="11" fill="#e9d3a7" stroke="#b9975b" stroke-width="1.5"/><rect x="455" y="224" width="6" height="24" fill="#7a4a22"/><rect x="466" y="224" width="6" height="24" fill="#1f1f1f"/><rect x="477" y="224" width="6" height="24" fill="#f08c1a"/><rect x="494" y="224" width="6" height="24" fill="#c9a227"/><text x="475" y="216" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#6b746e" font-weight="normal" text-anchor="middle">10kΩ 保護電阻（必接）</text><path d="M530,236 L670,236" fill="none" stroke="#00000033" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M530,236 L670,236" fill="none" stroke="#0f9b8e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="44" y="420" width="872" height="148" rx="14" fill="#fff7ec" stroke="#f3c98b" stroke-width="1.5"/><text x="64" y="450" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start">接線重點</text><text x="64" y="478" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">① 中間腳要先串一顆 10kΩ（棕黑橙）再接 P4。P4 同時是點陣的腳位，不串電阻可能傷到 micro:bit。</text><text x="64" y="504" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">② 旁邊兩腳分別接 3V 和 GND（順序相反只是旋轉方向相反）。</text><text x="64" y="530" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">③ 接好後要把 config/hardware.json 的 use_budget_knob 改成 true，旋鈕才會作用；沒接卻打開，數值會亂跳。</text><text x="64" y="556" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#1f2a24" font-weight="normal" text-anchor="start">④ 轉旋鈕選預算：1～4 段＋A（不限）；讀旋鈕時點陣會極短暫熄滅一下，是正常的。</text></svg>