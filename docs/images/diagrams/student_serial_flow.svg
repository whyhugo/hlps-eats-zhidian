<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#1f2328">
  <title>學生版：micro:bit（LED＋A/B 鍵）與網頁的通訊流程</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1f2328"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c8362b"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- micro:bit -->
  <rect x="30" y="60" width="250" height="300" rx="10" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="155" y="46" text-anchor="middle" font-weight="700" font-size="17">micro:bit（積木程式）</text>
  <circle cx="75" cy="120" r="16" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="75" y="125" text-anchor="middle" font-weight="700">A</text>
  <text x="102" y="125">切換健身／養生</text>
  <circle cx="75" cy="175" r="16" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="75" y="180" text-anchor="middle" font-weight="700">B</text>
  <text x="102" y="180">求籤推薦</text>
  <line x1="50" y1="215" x2="260" y2="215" stroke="#d0d7de"/>
  <circle cx="75" cy="252" r="9" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="95" y="257">P0 綠燈</text>
  <circle cx="75" cy="284" r="9" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="95" y="289">P1 黃燈</text>
  <circle cx="75" cy="316" r="9" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="95" y="321">P2 紅燈</text>

  <!-- USB -->
  <rect x="395" y="160" width="170" height="100" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
  <text x="480" y="198" text-anchor="middle" font-weight="700" font-size="17">USB 線</text>
  <text x="480" y="222" text-anchor="middle" font-size="13" fill="#57606a">序列埠（COM3…）</text>
  <text x="480" y="242" text-anchor="middle" font-size="13" fill="#57606a">115200 baud</text>

  <!-- Web page -->
  <rect x="680" y="60" width="250" height="300" rx="10" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="805" y="46" text-anchor="middle" font-weight="700" font-size="17">網頁（Chrome／Edge）</text>
  <text x="700" y="110" font-weight="700">Web Serial 讀到一行</text>
  <text x="700" y="140">「A」→ 切換模式</text>
  <text x="700" y="166">「B」→ 執行推薦：</text>
  <text x="716" y="192" font-size="14" fill="#57606a">① 依公式算分、排序</text>
  <text x="716" y="214" font-size="14" fill="#57606a">② 排除超出預算、太辣</text>
  <text x="716" y="236" font-size="14" fill="#57606a">③ 取前 3 名</text>
  <line x1="700" y1="258" x2="910" y2="258" stroke="#d0d7de"/>
  <text x="700" y="288">第 1 名的燈號</text>
  <text x="700" y="314">綠 G ／ 黃 Y ／ 紅 R</text>

  <!-- 送出：micro:bit → 網頁 -->
  <path d="M280 150 H395" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M565 150 H680" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="337" y="138" text-anchor="middle" font-size="14">寫入一行</text>
  <text x="337" y="172" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700">"A" / "B"</text>
  <text x="622" y="138" text-anchor="middle" font-size="14">讀到一行</text>

  <!-- 回傳：網頁 → micro:bit -->
  <path d="M680 290 H565" fill="none" stroke="#c8362b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M395 290 H280" fill="none" stroke="#c8362b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="622" y="278" text-anchor="middle" font-size="14" fill="#c8362b">送回一行</text>
  <text x="622" y="312" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="700" font-size="14" fill="#c8362b">"G"/"Y"/"R"</text>
  <text x="337" y="278" text-anchor="middle" font-size="14" fill="#c8362b">當收到換行</text>
  <text x="337" y="312" text-anchor="middle" font-size="14" fill="#c8362b">→ 亮對應的燈</text>

  <!-- 底部步驟 -->
  <text x="480" y="398" text-anchor="middle" font-size="14" fill="#57606a">按 B → 送出 "B" → 網頁推薦 → 送回 "G" → micro:bit 亮綠燈（A 鍵同理，只切換模式、不回傳）</text>
</svg>
