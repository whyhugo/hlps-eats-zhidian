<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 990"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#1f2a24"/></marker>
<marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#6b746e"/></marker>
</defs><rect width="960" height="990" rx="22" fill="#f6f4ef"/><rect x="16" y="16" width="928" height="958" rx="18" fill="#ffffff" stroke="#e3dfd6"/><text x="44" y="62" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1f2a24" font-weight="bold" text-anchor="start">通訊時序</text><text x="44" y="90" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#6b746e" font-weight="normal" text-anchor="start">USB 序列埠 115200 baud，一行一個指令；網頁上的虛擬 micro:bit 走同一套指令</text><rect x="80" y="130" width="180" height="40" rx="10" fill="#22b35e"/><text x="170" y="156" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">micro:bit</text><line x1="170" y1="170" x2="170" y2="960" stroke="#e3dfd6" stroke-width="2" stroke-dasharray="5 5"/><rect x="390" y="130" width="180" height="40" rx="10" fill="#2f6fdf"/><text x="480" y="156" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">電腦 fitwell serve</text><line x1="480" y1="170" x2="480" y2="960" stroke="#e3dfd6" stroke-width="2" stroke-dasharray="5 5"/><rect x="700" y="130" width="180" height="40" rx="10" fill="#8b5cf6"/><text x="790" y="156" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">瀏覽器</text><line x1="790" y1="170" x2="790" y2="960" stroke="#e3dfd6" stroke-width="2" stroke-dasharray="5 5"/><rect x="40" y="192" width="880" height="28" rx="8" fill="#f6f4ef"/><text x="56" y="211" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">① 連線與設定</text><line x1="480" y1="250" x2="170" y2="250" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="325.0" y="242" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">HELLO?（每 3 秒，直到有回應）</text><line x1="170" y1="294" x2="480" y2="294" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="325.0" y="286" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">HELLO:3.0、MODE:FITNESS</text><line x1="480" y1="346" x2="170" y2="346" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="325.0" y="312" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">CFG 設定 × 5 行（config/hardware.json）</text><text x="325.0" y="329" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">旋鈕開關、蜂鳴器種類與長度、指針方向</text><rect x="175.0" y="366" width="300" height="28" rx="8" fill="#fff7ec" stroke="#f3c98b"/><text x="325" y="385" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">之後每 15 秒重送一次 CFG</text><rect x="40" y="414" width="880" height="28" rx="8" fill="#f6f4ef"/><text x="56" y="433" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">② 調整條件（轉旋鈕／按 A）</text><line x1="170" y1="472" x2="480" y2="472" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="325.0" y="464" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">BUDGET:1、SPICY:ANY、MODE:WELLNESS</text><line x1="480" y1="516" x2="790" y2="516" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="635.0" y="508" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">SSE：state（網頁同步切換）</text><rect x="40" y="552" width="880" height="28" rx="8" fill="#f6f4ef"/><text x="56" y="571" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">③ 推薦（按健身鈕；網頁按鈕也走同一條路）</text><line x1="170" y1="610" x2="480" y2="610" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="325.0" y="602" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">GO:FITNESS</text><rect x="360.0" y="630" width="240" height="28" rx="8" fill="#fff7ec" stroke="#f3c98b"/><text x="480" y="649" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">推薦引擎：過濾 → 排序 → 前 3 名</text><line x1="480" y1="690" x2="790" y2="690" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="635.0" y="682" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">SSE：result（卡片、燈號、流程）</text><line x1="480" y1="734" x2="170" y2="734" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><text x="325.0" y="726" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">SCORE:92 → LIGHT:GREEN → SHOW:3</text><rect x="40.0" y="754" width="280" height="28" rx="8" fill="#fff7ec" stroke="#f3c98b"/><text x="180" y="773" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">亮綠燈 → 嗶 → 指針轉到 92%</text><rect x="40" y="806" width="880" height="28" rx="8" fill="#f6f4ef"/><text x="56" y="825" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#1f2a24" font-weight="bold" text-anchor="start">④ 例外處理</text><line x1="170" y1="864" x2="480" y2="864" stroke="#6b746e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahm)"/><text x="325.0" y="856" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">Traceback／MemoryError（程式當掉）</text><line x1="480" y1="908" x2="170" y2="908" stroke="#6b746e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahm)"/><text x="325.0" y="900" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">Ctrl+C、Ctrl+D（自動軟重開）→ 回到 ①</text><rect x="30.0" y="936" width="300" height="28" rx="8" fill="#fff7ec" stroke="#f3c98b"/><text x="180" y="955" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#1f2a24" font-weight="normal" text-anchor="middle">3 秒沒收到 LIGHT → 點陣顯示 😕</text></svg>