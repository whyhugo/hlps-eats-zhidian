ill="#6b746e" font-weight="normal" text-anchor="start">6. 檢查標籤與加權是否一致</text><line x1="240" y1="205" x2="300" y2="240" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><line x1="240" y1="345" x2="300" y2="310" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><rect x="660" y="290" width="260" height="110" rx="12" fill="#ffffff" stroke="#22b35e" stroke-width="2"/><rect x="660" y="290" width="260" height="6" rx="3" fill="#22b35e"/><text x="674" y="318" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#1f2a24" font-weight="bold" text-anchor="start">dishes.csv</text><text x="674" y="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#6b746e" font-weight="normal" text-anchor="start">224 道可推薦（231 − 7 重複）</text><text x="674" y="360" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#6b746e" font-weight="normal" text-anchor="start">中文表頭，Excel 可直接打開</text><rect x="660" y="150" width="260" height="110" rx="12" fill="#ffffff" stroke="#f08c1a" stroke-width="2"/><rect x="660" y="150" width="260" height="6" rx="3" fill="#f08c1a"/><text x="674" y="178" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#1f2a24" font-weight="bold" text-anchor="start">data_report.md</text><text x="674" y="200" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#6b746e" font-weight="normal" text-anchor="start">自動產生的問題清單</text><text x="674" y="220" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" fill="#6b746e" font-weight="normal" text-anchor="start">給學生修正原始表單</text><line x1="600" y1="240" x2="660" y2="205" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><line x1="600" y1="310" x2="660" y2="345" stroke="#1f2a24" stroke-width="2" marker-end="url(#ah)"/><rect x="300" y="450" width="300" height="110" rx="12" fil